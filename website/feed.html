<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Her Space | Feed</title>
  <link rel="stylesheet" href="feed.css" />
</head>
<body>
  <div class="feed-page">
    <aside class="sidebar left-sidebar">
      <a href="index.html" class="brand-block">
        <img src="images/herSpaceLogo.png" alt="Her Space icon" class="brand-icon" />
      </a>

      <nav class="side-nav">
        <a href="#" class="side-link active">Home</a>
        <a href="#" class="side-link">Profile</a>
        <a href="#" class="side-link">Notifications</a>
        <a href="#" class="side-link">Query</a>
        <a href="#" class="side-link">Verify Posts</a>
      </nav>

      <button class="create-post-btn">+ Create Post</button>
    </aside>

    <main class="feed-main">
      <header class="feed-topbar">
        <div class="top-actions">
          <button class="top-chip">Following</button>
          <button class="top-chip filled">Explore</button>
        </div>
      </header>

      <section class="stories-row">
        <div class="story-card add-story">
          <div class="story-avatar">+</div>
          <span>Create Story</span>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
